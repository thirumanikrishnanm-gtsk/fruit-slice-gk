<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#5b2ca0">
<meta name="description" content="Fruit Slice GK - a fun GK game for kids">
<link rel="manifest" href="manifest.json">
<title>Fruit Slice GK</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#78dff5;color:#173b52;overflow-x:hidden}
button{font:inherit}
#app{min-height:100vh;background:linear-gradient(#75dcf5 0 58%,#88df72 58%);position:relative}
.screen{display:none;min-height:100vh;padding:18px 14px 24px;position:relative;overflow:hidden}
.screen.active{display:flex;flex-direction:column}
.decor{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.cloud{position:absolute;width:110px;height:26px;background:#ffffffaa;border-radius:30px}.cloud:before,.cloud:after{content:"";position:absolute;background:inherit;border-radius:50%}.cloud:before{width:52px;height:52px;left:18px;top:-25px}.cloud:after{width:60px;height:60px;right:15px;top:-30px}
.c1{top:100px;left:4%}.c2{top:175px;right:2%;transform:scale(.75)}
.flowers{position:absolute;bottom:0;left:0;right:0;height:95px;background:radial-gradient(circle at 10% 70%,#ff8bb3 0 7px,transparent 8px),radial-gradient(circle at 24% 82%,#ffd45c 0 7px,transparent 8px),radial-gradient(circle at 42% 70%,#ff8bb3 0 7px,transparent 8px),radial-gradient(circle at 65% 84%,#ffd45c 0 7px,transparent 8px),radial-gradient(circle at 86% 70%,#ff8bb3 0 7px,transparent 8px)}
.topbar{position:relative;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:8px;background:#ffffffed;border-radius:22px;padding:10px 14px;box-shadow:0 5px 0 #5a8f7a33}
.brand{font-size:clamp(22px,7vw,34px);font-weight:1000;color:#6330a5;text-align:center;text-shadow:0 2px #fff}
.btn{border:0;border-radius:20px;padding:14px 22px;font-weight:1000;cursor:pointer;min-height:48px;box-shadow:0 5px 0 #5a3d9633}
.primary{background:#ffd34e;color:#563c11}.purple{background:#6735b4;color:#fff}.green{background:#52c948;color:#fff}.white{background:#fff;color:#563c96}
.hero{position:relative;z-index:3;display:flex;flex:1;align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center}
.hero h1{font-size:clamp(38px,11vw,62px);line-height:.95;margin:0;color:#fff;text-shadow:0 4px #6330a5,0 7px 0 #ffffff44}
.hero p{font-weight:900;background:#fff;border-radius:18px;padding:9px 15px;margin:0}
.character{width:210px;height:270px;position:relative;transform-origin:50% 90%;filter:drop-shadow(0 10px 6px #40505a44)}
.character.small{width:125px;height:160px;filter:drop-shadow(0 6px 4px #40505a33)}
.character svg{width:100%;height:100%;overflow:visible}
.character .knife{transform-box:fill-box;transform-origin:12% 80%;transition:transform .12s ease}
.animJump{animation:jumpAttack 1s cubic-bezier(.18,.78,.22,1) forwards}
.animLand{animation:landBack .62s cubic-bezier(.2,.8,.25,1) forwards}
.knifeSwing{transform:rotate(-78deg)}
@keyframes jumpAttack{0%{transform:translate(0,0) rotate(0)}32%{transform:translate(var(--dx),-115px) rotate(-5deg)}68%{transform:translate(calc(var(--dx)*.92),-245px) rotate(5deg)}100%{transform:translate(var(--dx),-265px) rotate(0)}}
@keyframes landBack{0%{transform:translate(var(--dx),-265px)}65%{transform:translate(0,8px) scaleY(.93)}100%{transform:translate(0,0) scaleY(1)}}
#homeCharacter{margin-top:10px}
.homeBtns{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.panelTitle{text-align:center;position:relative;z-index:3;color:#fff;font-size:30px;font-weight:1000;text-shadow:0 3px #6330a5;margin:10px 0}
.animalGrid{position:relative;z-index:3;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:680px;width:100%;margin:auto}
.animalCard{border:3px solid transparent;background:#ffffffee;border-radius:22px;padding:8px 4px;min-height:165px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 6px 0 #547e6d33}
.animalCard.selected{border-color:#ffd34e;box-shadow:0 0 0 4px #fff8,0 7px 0 #547e6d33;transform:translateY(-2px)}
.animalName{font-weight:1000;color:#5b2ca0}
.gameWrap{position:relative;z-index:3;flex:1;display:flex;flex-direction:column}
.questionBox{background:#fff;border-radius:20px;padding:12px 16px;margin:10px auto 4px;max-width:560px;text-align:center;font-weight:1000;font-size:clamp(18px,5vw,25px);box-shadow:0 5px 0 #557c6a33}
.stats{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#ffffffd9;border-radius:18px;padding:8px 12px;font-weight:1000}
.field{position:relative;flex:1;min-height:520px;overflow:hidden;border-radius:25px}
.option{position:absolute;width:112px;height:112px;border:0;background:transparent;cursor:pointer;z-index:8;touch-action:manipulation}
.option .fruit{width:86px;height:86px;margin:13px auto 0;position:relative;filter:drop-shadow(0 8px 4px #40505a44)}
.option .label{display:inline-block;background:#fff;border-radius:14px;padding:5px 9px;font-size:13px;font-weight:1000;color:#173b52;white-space:nowrap}
.fruitShape{position:absolute;inset:0}
.apple{background:radial-gradient(circle at 30% 25%,#fff9 0 8%,#ff6d6d 9% 25%,#ef4b4b 55%,#cf2e42);border-radius:48% 52% 50% 48%;border:4px solid #b52e3b}
.orange{background:radial-gradient(circle at 30% 25%,#fff8 0 7%,#ffc75b 8% 25%,#f4a62c 60%,#dc7d16);border-radius:50%;border:4px solid #c97c1d}
.banana{background:linear-gradient(125deg,#fff07b,#ffd33f 50%,#e5a51d);border-radius:75% 25% 75% 25%;transform:rotate(-25deg);border:4px solid #c48b19}
.grapes{background:radial-gradient(circle at 28% 25%,#fff8 0 6%,#a96be8 7% 30%,#7040bb 65%,#4e2b96);border-radius:45%;border:4px solid #5a3499}
.watermelon{background:repeating-linear-gradient(75deg,#3e9b46 0 12px,#72bd50 12px 21px);border-radius:50%;border:5px solid #24753b}
.strawberry{background:linear-gradient(135deg,#ff6d72,#e7354d);clip-path:polygon(50% 100%,7% 30%,22% 8%,50% 18%,78% 8%,93% 30%);border:4px solid #c72e42}
.pineapple{background:repeating-linear-gradient(45deg,#f7c74b 0 9px,#e6aa2e 9px 12px);border-radius:45% 45% 38% 38%;border:4px solid #c18b1d}
.melon{background:linear-gradient(#c7e66d,#80bf43);border-radius:50%;border:4px solid #57983c}
.option:nth-child(1){left:10%;top:34px}.option:nth-child(2){left:50%;top:120px}.option:nth-child(3){right:7%;top:48px}
.option.fall1{animation:fall1 4.7s linear forwards}.option.fall2{animation:fall2 4.4s linear forwards}.option.fall3{animation:fall3 4.9s linear forwards}
@keyframes fall1{to{transform:translateY(380px) rotate(12deg)}}@keyframes fall2{to{transform:translateY(300px) rotate(-15deg)}}@keyframes fall3{to{transform:translateY(360px) rotate(10deg)}}
.mascotGame{position:absolute;bottom:4px;left:50%;margin-left:-105px;z-index:10}
.sliceLine{position:absolute;z-index:15;left:50%;top:230px;width:180px;height:18px;margin-left:-90px;border-radius:50%;background:linear-gradient(90deg,transparent,#fff,#fff,transparent);transform:rotate(-28deg) scaleX(0);opacity:0}
.sliceLine.show{animation:sweep .38s ease-out forwards}@keyframes sweep{20%{opacity:1;transform:rotate(-28deg) scaleX(1)}100%{opacity:0;transform:rotate(-28deg) scaleX(1.2)}}
.cutLeft,.cutRight{position:absolute;z-index:14;width:46px;height:78px;border-radius:45%;opacity:0}
.cutLeft{background:#ef4b4b;left:calc(50% - 52px);top:155px}.cutRight{background:#ef4b4b;left:calc(50% + 6px);top:155px}
.cutLeft.show{animation:pieceL .65s forwards}.cutRight.show{animation:pieceR .65s forwards}
@keyframes pieceL{0%{opacity:1}100%{opacity:0;transform:translate(-70px,65px) rotate(-35deg)}}@keyframes pieceR{0%{opacity:1}100%{opacity:0;transform:translate(70px,65px) rotate(35deg)}}
.feedback{position:absolute;z-index:30;top:42%;left:50%;transform:translate(-50%,-50%);background:#fff;border-radius:24px;padding:14px 22px;font-size:26px;font-weight:1000;color:#2d9c32;display:none;box-shadow:0 8px 0 #557c6a33}.feedback.show{display:block}
.bottomControls{display:flex;justify-content:center;gap:8px;padding:6px 0}
.progress{height:10px;background:#ffffff99;border-radius:10px;overflow:hidden;margin:5px 0}.progress>i{display:block;height:100%;background:#7a42c7;width:0}
.resultBox{position:relative;z-index:3;text-align:center;margin:auto;background:#fff;border-radius:28px;padding:22px;max-width:520px;width:100%;box-shadow:0 10px 0 #557c6a33}.stars{font-size:48px;letter-spacing:4px}.resultBox h2{font-size:38px;color:#2d9c32;margin:6px}.scoreBig{font-size:32px;font-weight:1000;color:#6330a5}
@media(max-width:420px){.animalGrid{grid-template-columns:repeat(2,1fr)}.animalCard{min-height:150px}.character.small{width:110px;height:145px}.field{min-height:500px}.option{width:105px;height:105px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
<section id="home" class="screen active">
<div class="decor"><div class="cloud c1"></div><div class="cloud c2"></div><div class="flowers"></div></div>
<div class="hero">
<div class="brand">🍎 FRUIT SLICE GK 🍉</div>
<div id="homeCharacter" class="character"></div>
<p>Learn GK • Slice the correct fruit!</p>
<div class="homeBtns"><button class="btn primary" id="playBtn">▶ PLAY</button><button class="btn purple" id="chooseBtn">🐾 CHOOSE MY ANIMAL</button></div>
</div>
</section>

<section id="animals" class="screen">
<div class="decor"><div class="cloud c1"></div><div class="cloud c2"></div><div class="flowers"></div></div>
<div class="panelTitle">🐾 Choose Your Animal</div>
<div id="animalGrid" class="animalGrid"></div>
<div class="homeBtns"><button class="btn white" id="animalBack">← BACK</button><button class="btn primary" id="animalPlay">▶ PLAY</button></div>
</section>

<section id="game" class="screen">
<div class="decor"><div class="cloud c1"></div><div class="cloud c2"></div><div class="flowers"></div></div>
<div class="gameWrap">
<div class="stats"><span id="qCount">Question 1/10</span><span id="score">⭐ 0</span><span id="lives">❤️ 3</span></div>
<div class="progress"><i id="progressBar"></i></div>
<div class="questionBox" id="question">Which fruit is red?</div>
<div class="field" id="field">
<button class="option" data-i="0" aria-label="Answer option 1"><span class="fruit"><span class="fruitShape"></span></span><span class="label"></span></button>
<button class="option" data-i="1" aria-label="Answer option 2"><span class="fruit"><span class="fruitShape"></span></span><span class="label"></span></button>
<button class="option" data-i="2" aria-label="Answer option 3"><span class="fruit"><span class="fruitShape"></span></span><span class="label"></span></button>
<div class="sliceLine" id="sliceLine"></div><div class="cutLeft" id="cutLeft"></div><div class="cutRight" id="cutRight"></div>
<div id="gameCharacter" class="character mascotGame"></div>
<div id="feedback" class="feedback">⭐ CORRECT!</div>
</div>
<div class="bottomControls"><button class="btn white" id="skipBtn">⏭ SKIP</button><button class="btn purple" id="soundBtn">🔊 SOUND</button></div>
</div>
</section>

<section id="result" class="screen">
<div class="decor"><div class="cloud c1"></div><div class="cloud c2"></div><div class="flowers"></div></div>
<div class="resultBox"><div id="resultCharacter" class="character" style="margin:auto"></div><div class="stars">⭐ ⭐ ⭐</div><h2>Great Job!</h2><div class="scoreBig" id="finalScore">Score: 0</div><p id="finalText">You're amazing!</p><div class="homeBtns"><button class="btn primary" id="againBtn">▶ PLAY AGAIN</button><button class="btn purple" id="resultHome">⌂ HOME</button></div></div>
</section>
</div>

<script>
(() => {
'use strict';

const animals = [
  ['lion','🦁','Lion','#f2b544','#8d5b2a'],['tiger','🐯','Tiger','#f28b35','#5d3b2b'],
  ['panda','🐼','Panda','#e9eef4','#252b35'],['elephant','🐘','Elephant','#aeb8c5','#687484'],
  ['bunny','🐰','Bunny','#f1b9d8','#b86c9b'],['monkey','🐵','Monkey','#b8794e','#6c412e'],
  ['fox','🦊','Fox','#ef8a38','#9d4b20'],['koala','🐨','Koala','#a9b1bb','#66707b'],
  ['frog','🐸','Frog','#76d76a','#358a40'],['puppy','🐶','Puppy','#d4aa76','#7d5638'],
  ['kitten','🐱','Kitten','#d5a7e8','#8d5aae'],['unicorn','🦄','Unicorn','#ef9fe9','#75459a']
];

let selected='lion', score=0, lives=3, qNo=0, busy=false, current=null, audioCtx=null;
const fruitTypes=[
 ['apple','Apple'],['orange','Orange'],['banana','Banana'],['grapes','Grapes'],
 ['watermelon','Watermelon'],['strawberry','Strawberry'],['pineapple','Pineapple'],['melon','Melon']
];

const facts=[
 ['What is the largest planet?','Jupiter','Saturn','Mars'],['Which animal is known as the king of the jungle?','Lion','Panda','Rabbit'],
 ['How many days are in a week?','7','5','10'],['What color is the sky on a clear day?','Blue','Green','Purple'],
 ['Which fruit is usually yellow and curved?','Banana','Apple','Grape'],['How many legs does a spider have?','8','6','4'],
 ['Which planet do we live on?','Earth','Mars','Venus'],['What do bees make?','Honey','Milk','Bread'],
 ['Which animal has a long trunk?','Elephant','Tiger','Fox'],['How many months are in a year?','12','10','8'],
 ['Which is the fastest land animal?','Cheetah','Elephant','Panda'],['What do plants need from the sun?','Light','Ice','Sand'],
 ['Which ocean is the largest?','Pacific Ocean','Indian Ocean','Arctic Ocean'],['How many sides does a triangle have?','3','4','5'],
 ['Which bird cannot fly and lives in Antarctica?','Penguin','Eagle','Parrot'],['What is frozen water called?','Ice','Steam','Cloud'],
 ['Which animal gives us wool?','Sheep','Horse','Dog'],['What is the opposite of hot?','Cold','Tall','Fast'],
 ['Which star is closest to Earth?','Sun','Sirius','Polaris'],['How many wheels does a bicycle have?','2','3','4'],
 ['Which shape has four equal sides?','Square','Circle','Triangle'],['What do cows give us?','Milk','Juice','Honey'],
 ['Which animal is famous for black-and-white stripes?','Zebra','Giraffe','Bear'],['Which fruit is often red and has seeds on its outside?','Strawberry','Banana','Orange'],
 ['How many fingers are on one hand?','5','4','6'],['Which gas do humans need to breathe?','Oxygen','Helium','Carbon dioxide'],
 ['What is the tallest animal?','Giraffe','Lion','Penguin'],['Which month comes after March?','April','May','February'],
 ['Which animal hops and has a pouch?','Kangaroo','Tiger','Whale'],['What is 5 + 5?','10','12','8'],
 ['Which is a mammal?','Dolphin','Crocodile','Frog'],['Which fruit is orange in color?','Orange','Grape','Watermelon'],
 ['How many continents are there?','7','5','9'],['What do we use to see?','Eyes','Ears','Nose'],
 ['Which animal says “moo”?','Cow','Cat','Dog'],['Which planet is famous for its rings?','Saturn','Earth','Mercury'],
 ['What is the baby of a dog called?','Puppy','Kitten','Calf'],['What is the baby of a cat called?','Kitten','Puppy','Foal'],
 ['Which animal is the largest on Earth?','Blue whale','Lion','Elephant'],['What do fish use to breathe in water?','Gills','Wings','Fur'],
 ['Which fruit has a green rind and red inside?','Watermelon','Banana','Apple'],['How many hours are in a day?','24','12','36'],
 ['What is the capital of India?','New Delhi','Mumbai','Chennai'],['Which festival is known as the festival of lights?','Diwali','Holi','Pongal'],
 ['Which animal is called a ship of the desert?','Camel','Horse','Elephant'],['What do butterflies start life as?','Caterpillars','Puppies','Seeds'],
 ['Which instrument has black and white keys?','Piano','Drum','Flute'],['Which season is usually the coldest?','Winter','Summer','Spring'],
 ['What is the largest land animal?','African elephant','Tiger','Giraffe'],['Which fruit is made into raisins when dried?','Grapes','Bananas','Apples']
];

function makeQuestions(){
  const out=[];
  for(let round=0;round<22;round++){
    for(const f of facts){
      const variants=[
        [f[0],f[1],f[2],f[3]],[`GK: ${f[0]}`,f[1],f[3],f[2]],
        [`Can you answer? ${f[0]}`,f[2],f[1],f[3]],[`Quick quiz! ${f[0]}`,f[1],f[2],f[3]]
      ];
      out.push(variants[round%variants.length]);
      if(out.length>=1000)return out;
    }
  }
  return out;
}
const questions=makeQuestions();

function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}

function characterSVG(kind){
  const a=animals.find(x=>x[0]===kind)||animals[0], body=a[3], dark=a[4];
  const common = `
  <defs>
   <linearGradient id="body" x1="0" y1="0" x2="1" y2="1"><stop stop-color="${body}"/><stop offset=".55" stop-color="${body}"/><stop offset="1" stop-color="${dark}"/></linearGradient>
   <linearGradient id="blade" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".6" stop-color="#d7e0ea"/><stop offset="1" stop-color="#7b8a9b"/></linearGradient>
  </defs>`;
  let ears='', extra='', mane='';
  if(kind==='lion') mane=`<circle cx="95" cy="78" r="67" fill="#a9642d" stroke="#684020" stroke-width="5"/>`;
  if(kind==='tiger') extra=`<path d="M60 65l18 12M130 65l-18 12M62 105l18-8M128 105l-18-8" stroke="#633c27" stroke-width="7" stroke-linecap="round"/>`;
  if(kind==='panda') extra=`<ellipse cx="73" cy="82" rx="15" ry="21" fill="#252b35" transform="rotate(25 73 82)"/><ellipse cx="117" cy="82" rx="15" ry="21" fill="#252b35" transform="rotate(-25 117 82)"/>`;
  if(kind==='elephant') ears=`<ellipse cx="37" cy="92" rx="30" ry="42" fill="#e79a9f" stroke="${dark}" stroke-width="5"/><ellipse cx="153" cy="92" rx="30" ry="42" fill="#e79a9f" stroke="${dark}" stroke-width="5"/>`;
  if(kind==='bunny') ears=`<ellipse cx="70" cy="32" rx="17" ry="40" fill="${body}" stroke="${dark}" stroke-width="5"/><ellipse cx="120" cy="32" rx="17" ry="40" fill="${body}" stroke="${dark}" stroke-width="5"/>`;
  if(kind==='monkey') ears=`<circle cx="40" cy="82" r="25" fill="${body}" stroke="${dark}" stroke-width="5"/><circle cx="150" cy="82" r="25" fill="${body}" stroke="${dark}" stroke-width="5"/>`;
  if(kind==='fox') extra=`<path d="M58 44L67 14 88 44M132 44L123 14 102 44" fill="${body}" stroke="${dark}" stroke-width="5"/>`;
  if(kind==='koala') ears=`<circle cx="43" cy="58" r="29" fill="${body}" stroke="${dark}" stroke-width="5"/><circle cx="147" cy="58" r="29" fill="${body}" stroke="${dark}" stroke-width="5"/>`;
  if(kind==='frog') extra=`<circle cx="68" cy="42" r="22" fill="${body}" stroke="${dark}" stroke-width="5"/><circle cx="122" cy="42" r="22" fill="${body}" stroke="${dark}" stroke-width="5"/>`;
  if(kind==='puppy') extra=`<path d="M48 53Q25 48 36 95Q48 117 62 91M142 53Q165 48 154 95Q142 117 128 91" fill="${body}" stroke="${dark}" stroke-width="5"/>`;
  if(kind==='kitten') extra=`<path d="M50 54L42 17 78 39M140 54L148 17 112 39" fill="${body}" stroke="${dark}" stroke-width="5"/>`;
  if(kind==='unicorn') extra=`<path d="M95 34L108 3 121 38Z" fill="#ffd65b" stroke="#a87820" stroke-width="4"/><path d="M55 48Q75 25 92 50Q108 24 128 51Q109 68 95 85Q77 66 55 48Z" fill="#ee72c5"/>`;
  const eye=`<circle cx="73" cy="83" r="10" fill="#263449"/><circle cx="117" cy="83" r="10" fill="#263449"/><circle cx="69" cy="79" r="4" fill="#fff"/><circle cx="113" cy="79" r="4" fill="#fff"/>`;
  const face = kind==='elephant'
    ? `<path d="M95 85Q88 111 101 118Q113 121 123 108" fill="none" stroke="${dark}" stroke-width="9" stroke-linecap="round"/>`
    : `<ellipse cx="95" cy="108" rx="27" ry="18" fill="#ffe5d8" stroke="${dark}" stroke-width="3"/><path d="M82 108Q95 120 108 108" fill="none" stroke="${dark}" stroke-width="4" stroke-linecap="round"/>`;
  return `<svg viewBox="0 0 190 270" role="img" aria-label="${esc(a[2])} holding a knife">${common}
  ${mane}${ears}${extra}
  <ellipse cx="95" cy="171" rx="58" ry="68" fill="url(#body)" stroke="${dark}" stroke-width="5"/>
  <rect x="61" y="205" width="27" height="48" rx="13" fill="${body}" stroke="${dark}" stroke-width="5"/>
  <rect x="102" y="205" width="27" height="48" rx="13" fill="${body}" stroke="${dark}" stroke-width="5"/>
  <ellipse cx="74" cy="250" rx="18" ry="8" fill="${dark}"/><ellipse cx="116" cy="250" rx="18" ry="8" fill="${dark}"/>
  <ellipse cx="95" cy="83" rx="57" ry="57" fill="url(#body)" stroke="${dark}" stroke-width="5"/>
  ${eye}${face}
  <path d="M49 145Q27 161 45 184" fill="none" stroke="${body}" stroke-width="18" stroke-linecap="round"/>
  <path d="M140 145Q165 155 153 180" fill="none" stroke="${body}" stroke-width="18" stroke-linecap="round"/>
  <path d="M76 145Q95 158 114 145V211H76Z" fill="${kind==='panda'||kind==='koala'?'#e9eef4':'#4f8fd5'}" opacity=".88"/>
  <circle cx="84" cy="158" r="6" fill="#ffd34f"/><circle cx="106" cy="158" r="6" fill="#ffd34f"/>
  <g class="knife"><rect x="143" y="165" width="25" height="12" rx="5" fill="#704522"/><path d="M163 171L188 150Q192 147 190 154L171 180Z" fill="url(#blade)" stroke="#596778" stroke-width="3"/></g>
  </svg>`;
}

function setCharacter(id,kind,small=false){
  const el=document.getElementById(id); el.className='character'+(small?' small':''); el.innerHTML=characterSVG(kind);
}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');}
function beep(type){
  try{
    if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended')audioCtx.resume();
    const o=audioCtx.createOscillator(),g=audioCtx.createGain(),n=audioCtx.currentTime;
    o.connect(g);g.connect(audioCtx.destination);
    const map={click:[520,.07,'sine'],slice:[180,.18,'sawtooth'],correct:[660,.16,'sine'],wrong:[130,.22,'square'],jump:[250,.12,'triangle']};
    const [freq,dur,wave]=map[type]||map.click;o.type=wave;o.frequency.setValueAtTime(freq,n);
    if(type==='correct')o.frequency.exponentialRampToValueAtTime(990,n+dur);
    if(type==='slice')o.frequency.exponentialRampToValueAtTime(70,n+dur);
    g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(.08,n+.015);g.gain.exponentialRampToValueAtTime(.0001,n+dur);
    o.start(n);o.stop(n+dur+.03);
  }catch(_){}
}

function buildAnimals(){
  const grid=document.getElementById('animalGrid');grid.innerHTML='';
  animals.forEach(a=>{
    const b=document.createElement('button');b.type='button';b.className='animalCard'+(selected===a[0]?' selected':'');
    b.innerHTML=`<div class="character small">${characterSVG(a[0])}</div><div class="animalName">${esc(a[2])}</div>`;
    b.addEventListener('click',()=>{selected=a[0];buildAnimals();setCharacter('homeCharacter',selected);setCharacter('resultCharacter',selected);beep('click')});
    grid.appendChild(b);
  });
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function makeRound(){
  current=questions[Math.floor(Math.random()*questions.length)];
  const answers=[current[1],current[2],current[3]];
  const shuffled=shuffle(answers.map((text,i)=>({text,correct:text===current[1]})));
  document.getElementById('question').textContent=current[0];
  document.querySelectorAll('.option').forEach((b,i)=>{
    b.className='option';b.dataset.correct=shuffled[i].correct?'1':'0';
    b.querySelector('.label').textContent=shuffled[i].text;
    const type=fruitTypes[(i+qNo)%fruitTypes.length][0];
    b.querySelector('.fruitShape').className='fruitShape '+type;
  });
  document.getElementById('qCount').textContent=`Question ${qNo+1}/10`;
  document.getElementById('score').textContent=`⭐ ${score}`;
  document.getElementById('lives').textContent=`❤️ ${lives}`;
  document.getElementById('progressBar').style.width=(qNo/10*100)+'%';
}
function resetCharacter(){
  const c=document.getElementById('gameCharacter');c.classList.remove('animJump','animLand');c.style.setProperty('--dx','0px');
  const k=c.querySelector('.knife');if(k)k.classList.remove('knifeSwing');
}
function nextQuestion(){
  if(qNo>=10||lives<=0){finish();return}
  qNo++;busy=false;resetCharacter();makeRound();
}
function slice(choice){
  if(busy)return;busy=true;beep('click');
  const field=document.getElementById('field'),c=document.getElementById('gameCharacter');
  const rect=choice.getBoundingClientRect(), fr=field.getBoundingClientRect();
  let dx=rect.left+rect.width/2-(fr.left+fr.width/2);
  dx=Math.max(-130,Math.min(130,dx));
  c.style.setProperty('--dx',dx+'px');
  const k=c.querySelector('.knife');
  c.classList.add('animJump');beep('jump');
  setTimeout(()=>{
    if(choice.dataset.correct==='1'){
      document.getElementById('feedback').textContent='⭐ CORRECT!';
      document.getElementById('feedback').classList.add('show');
      if(k)k.classList.add('knifeSwing');
      document.getElementById('sliceLine').classList.add('show');
      document.getElementById('cutLeft').classList.add('show');
      document.getElementById('cutRight').classList.add('show');
      beep('slice');setTimeout(()=>beep('correct'),120);score+=10;
    }else{
      document.getElementById('feedback').textContent='❌ OOPS!';
      document.getElementById('feedback').style.color='#d33';
      document.getElementById('feedback').classList.add('show');lives--;beep('wrong');
    }
  },650);
  setTimeout(()=>{
    c.classList.remove('animJump');c.classList.add('animLand');
    if(k)k.classList.remove('knifeSwing');
  },980);
  setTimeout(()=>{
    document.getElementById('feedback').classList.remove('show');
    document.getElementById('feedback').style.color='#2d9c32';
    document.getElementById('sliceLine').classList.remove('show');
    document.getElementById('cutLeft').classList.remove('show');document.getElementById('cutRight').classList.remove('show');
    nextQuestion();
  },1650);
}
function startGame(){score=0;lives=3;qNo=0;show('game');setCharacter('gameCharacter',selected);makeRound();beep('click')}
function finish(){
  document.getElementById('finalScore').textContent=`Score: ${score}`;
  document.getElementById('finalText').textContent=lives>0?'You did an amazing job!':'Great try! Keep learning and play again!';
  setCharacter('resultCharacter',selected);show('result');beep('correct');
}
document.getElementById('playBtn').addEventListener('click',startGame);
document.getElementById('chooseBtn').addEventListener('click',()=>{buildAnimals();show('animals');beep('click')});
document.getElementById('animalBack').addEventListener('click',()=>show('home'));
document.getElementById('animalPlay').addEventListener('click',startGame);
document.getElementById('againBtn').addEventListener('click',startGame);
document.getElementById('resultHome').addEventListener('click',()=>show('home'));
document.getElementById('skipBtn').addEventListener('click',()=>{if(!busy){beep('click');nextQuestion()}});
document.getElementById('soundBtn').addEventListener('click',()=>beep('click'));
document.querySelectorAll('.option').forEach(b=>b.addEventListener('click',()=>slice(b)));
setCharacter('homeCharacter',selected);setCharacter('resultCharacter',selected);buildAnimals();
})();
</script>
